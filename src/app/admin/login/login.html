<div class="form-wrapper flex flex-col justify-center items-center bg-linear-to-r from-blue-300 to-blue-400 min-h-screen">
<div
  class="admin-form w-11/12 sm:w-5/6 lg:w-3/5 xl:w-2/5 2xl:w-1/3 max-w-2xl mx-auto bg-blue-100 shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-300 p-4 sm:p-6 md:p-8 lg:p-10 rounded-lg flex justify-center my-5 md:my-7 lg:my-9 min-h-40 sm:min-h-50 md:min-h-60"
>
  <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="w-full flex items-center">
    <div class="form-content flex flex-col items-center gap-2 w-full">
      
      <!-- Heading -->
      <div
        class="heading text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold font-bebas tracking-wide text-cyan-900 pb-2 sm:pb-3 md:pb-4 lg:pb-5 text-center w-full"
      >
        User Login
      </div>

      <!-- Email -->
      <div class="email flex flex-col gap-1 sm:gap-1.5 md:gap-2 w-full">
        <label for="email" class="font-semibold font-poppins text-sm sm:text-base md:text-lg">Email</label>
        <input
          id="email"
          class="inputField w-full text-xs sm:text-sm md:text-base font-normal text-gray-700 border border-gray-300 rounded p-2.5 md:p-3 lg:p-3.5 focus:outline-1 focus:outline-primary font-inter"
          type="email"
          placeholder="Enter your email"
          formControlName="email"
          aria-invalid="{{ signInForm.get('email')?.invalid ? 'true' : 'false' }}"
        />
      </div>

      <!-- Email Errors -->
      <div *ngIf="signInForm.get('email')?.touched && signInForm.get('email')?.invalid" class="mt-1 w-full">
        <small class="text-red-600 font-inter block text-xs sm:text-sm md:text-base" *ngIf="signInForm.get('email')?.hasError('required')">
          Email is required
        </small>
        <small class="text-red-600 font-inter block text-xs sm:text-sm md:text-base" *ngIf="signInForm.get('email')?.hasError('email')">
          Please enter a valid Email
        </small>
      </div>

      <!-- Password -->
      <div class="password flex flex-col gap-1 sm:gap-1.5 md:gap-2 w-full">
        <label for="password" class="font-semibold font-poppins text-sm sm:text-base md:text-lg">Password</label>
        <input
          id="password"
          class="inputField w-full text-xs sm:text-sm md:text-base font-normal text-gray-700 border border-gray-300 rounded p-2.5 md:p-3 lg:p-3.5 focus:outline-1 focus:outline-primary font-inter"
          type="password"
          placeholder="Enter your password"
          formControlName="password"
          aria-invalid="{{ signInForm.get('password')?.invalid ? 'true' : 'false' }}" 
        />
      </div>

      <!-- Password Errors -->
      <div *ngIf="signInForm.get('password')?.touched && signInForm.get('password')?.invalid" class="mt-1 w-full">
        <small class="text-red-600 font-inter block text-xs sm:text-sm md:text-base" *ngIf="signInForm.get('password')?.hasError('required')">
          Password is required
        </small>
        <small class="text-red-600 font-inter block text-xs sm:text-sm md:text-base" *ngIf="signInForm.get('password')?.hasError('minlength')">
          Password must be at least 8 characters.
        </small>
      </div>

      <!-- Submit Button -->
      <div class="btn mx-auto mt-3 sm:mt-4 md:mt-5 lg:mt-6 w-full sm:w-auto">
        <button
          class="disabled:bg-blue-200 bg-blue-400 px-6 sm:px-8 md:px-10 lg:px-12 py-2.5 sm:py-3 md:py-3.5 lg:py-4 text-sm sm:text-base md:text-lg text-white rounded-lg cursor-pointer w-full sm:w-auto transition-colors duration-200 hover:bg-blue-500 disabled:cursor-not-allowed"
          type="submit"
          [disabled]="signInForm.invalid || loading"
        >
          {{ loading ? 'Loading' : 'Sign In' }}
        </button>
      </div>
      <!--Signup Link-->
      <span class="signup-link w-full mt-2 text-xs md:text-sm lg:text-base font-normal font-poppins tracking-normal text-gray-500 text-center">Don't have an account? <a routerLink="/signup" class="text-xs  md:text-sm lg:text-base font-normal font-poppins tracking-normal text-primary underline text-center">Signup</a></span>
    </div>
  </form>
</div>

</div>
